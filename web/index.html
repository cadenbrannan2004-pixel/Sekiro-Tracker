<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sekiro Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sekiro Tracker</h1>
    <span id="status" class="status">connecting...</span>
  </header>

  <nav id="slot-tabs" class="tabs" aria-label="Save slots"></nav>

  <section class="summary" aria-label="Totals">
    <div class="stat">
      <span class="stat-label">Prayer Beads</span>
      <span id="beads-total" class="stat-value">–</span>
      <div class="bar-track"><div id="beads-bar" class="bar-fill"></div></div>
    </div>
    <div class="stat">
      <span class="stat-label">Gourd Seeds</span>
      <span id="gourds-total" class="stat-value">–</span>
      <div class="bar-track"><div id="gourds-bar" class="bar-fill"></div></div>
    </div>
  </section>

  <main>
    <section class="card">
      <h2>Prayer Beads <span id="beads-count" class="count"></span></h2>
      <ul id="beads-list" class="checklist"></ul>
    </section>

    <section class="card">
      <h2>Gourd Seeds <span id="gourds-count" class="count"></span></h2>
      <ul id="gourds-list" class="checklist"></ul>
    </section>

    <section class="card">
      <h2>Prosthetic Tools <span id="tools-count" class="count"></span></h2>
      <ul id="tools-list" class="checklist"></ul>
    </section>

    <section class="card">
      <h2>Quantity Targets</h2>
      <ul id="quantities-list" class="bars"></ul>
    </section>

    <section class="card wide">
      <h2>Endings <span class="hint">(manual checklist)</span></h2>
      <div id="endings" class="endings"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
