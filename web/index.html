<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sekiro Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sekiro Tracker</h1>
    <span id="status" class="status">connecting...</span>
  </header>

  <main>
    <section class="card">
      <h2>Prayer Beads <span id="beads-count" class="count"></span></h2>
      <ul id="beads-list" class="checklist"></ul>
    </section>

    <section class="card">
      <h2>Prosthetic Tools <span id="tools-count" class="count"></span></h2>
      <ul id="tools-list" class="checklist"></ul>
    </section>

    <section class="card">
      <h2>Quantity Targets</h2>
      <ul id="quantities-list" class="bars"></ul>
    </section>

    <section class="card wide">
      <h2>Endings <span class="hint">(manual checklist -- not read from the save)</span></h2>
      <div id="endings" class="endings"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
